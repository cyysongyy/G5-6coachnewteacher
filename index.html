<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<title>Teacher Coach 教師教練</title>
<meta name="description" content="把每天的班級事件，變成我的教師成長訓練。單機版，資料只存在這支手機裡。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1c1c1e; --muted:#6b6b70; --border:#e5e5ea;
  --accent:#4f7cff; --accent-ink:#ffffff; --danger:#e5484d; --warn:#b8770a; --warn-bg:#fff4e0;
  --good:#1f9254; --good-bg:#e8f7ee; --radius:16px; --gap:12px;
  --c-student:#ff6b6b; --c-classroom:#4f7cff; --c-teaching:#0fa3a3; --c-admin:#8451e0; --c-people:#e08e00;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f0f11; --card:#1b1b1e; --text:#f2f2f3; --muted:#9a9aa0; --border:#2c2c30;
    --warn-bg:#3a2c0f; --good-bg:#0f2b1c; }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
#app{ max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
#topbar{
  position:sticky; top:0; z-index:10; background:var(--bg); padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border);
}
#topbar h1{ font-size:17px; margin:0; flex:1; }
.iconbtn{
  border:none; background:var(--card); color:var(--text); border-radius:12px; width:36px; height:36px;
  font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--border);
}
#view-root{ flex:1; padding:16px; padding-bottom:32px; }
#tabbar{
  position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border);
  display:flex; padding-bottom:env(safe-area-inset-bottom); max-width:560px; margin:0 auto;
}
.tab{ flex:1; background:none; border:none; padding:8px 4px 10px; color:var(--muted); font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;}
.tab.active{ color:var(--accent); font-weight:600; }
.tab .ti{ font-size:20px; }

.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:var(--gap); }
.card h2{ font-size:15px; margin:0 0 10px; }
.muted{ color:var(--muted); font-size:13px; }
.big-btn{
  width:100%; padding:16px; border-radius:var(--radius); border:none; background:var(--accent); color:var(--accent-ink);
  font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
}
.ghost-btn{ width:100%; padding:13px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px; font-weight:600; cursor:pointer; }
.danger-btn{ background:var(--danger); color:#fff; border:none; }
.quickgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0; }
.quickgrid button{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 4px; font-size:12px; cursor:pointer; color:var(--text); }
.quickgrid .qe{ font-size:22px; display:block; margin-bottom:4px; }
.scorewrap{ display:flex; align-items:center; gap:14px; }
.scorenum{ font-size:32px; font-weight:800; }
.bar-outer{ background:var(--border); border-radius:8px; height:10px; overflow:hidden; flex:1; }
.bar-inner{ height:100%; background:var(--accent); border-radius:8px; }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ padding:9px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); font-size:13px; cursor:pointer; color:var(--text); }
.chip.selected{ background:var(--accent); color:#fff; border-color:var(--accent); }
label.field{ display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
label.field:first-child{ margin-top:0; }
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; font-family:inherit;
}
textarea{ min-height:70px; resize:vertical; }
.hint{ font-size:12px; color:var(--muted); margin-top:4px; }
.banner{ border-radius:12px; padding:12px 14px; font-size:13px; margin-bottom:12px; line-height:1.6; }
.banner.warn{ background:var(--warn-bg); color:var(--warn); }
.banner.good{ background:var(--good-bg); color:var(--good); }
.progress-dots{ display:flex; gap:5px; justify-content:center; margin-bottom:14px; }
.progress-dots span{ width:7px; height:7px; border-radius:50%; background:var(--border); }
.progress-dots span.on{ background:var(--accent); }
.steplabel{ text-align:center; font-size:12px; color:var(--muted); margin-bottom:10px; }
.footer-nav{ display:flex; gap:10px; margin-top:18px; }
.footer-nav .big-btn, .footer-nav .ghost-btn{ flex:1; }
.theory-card{ border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px; }
.theory-card h3{ margin:0 0 4px; font-size:14px; }
.theory-card .tag{ font-size:11px; color:var(--accent); font-weight:700; }
.theory-card p{ margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5; }
.qa{ margin-bottom:10px; }
.qa p.q{ font-size:13.5px; font-weight:600; margin:0 0 6px; }
.event-row{ display:flex; align-items:center; gap:10px; padding:12px; background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer; }
.event-row .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.event-row .et{ flex:1; min-width:0; }
.event-row .et .title{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.event-row .et .meta{ font-size:12px; color:var(--muted); }
.date-sep{ font-size:12px; color:var(--muted); margin:16px 0 8px; font-weight:600; }
.emoji-row{ display:flex; gap:8px; flex-wrap:wrap; }
.emoji-btn{ display:flex; flex-direction:column; align-items:center; gap:2px; border:1px solid var(--border); background:var(--card); border-radius:12px; padding:10px 12px; cursor:pointer; font-size:11px; color:var(--text); }
.emoji-btn .em{ font-size:22px; }
.emoji-btn.selected{ border-color:var(--accent); background:var(--accent); color:#fff; }
input[type=range]{ width:100%; }
.kv{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border); }
.kv:last-child{ border-bottom:none; }
.kv .k{ color:var(--muted); }
.bars{ display:flex; flex-direction:column; gap:10px; }
.bar-item .lbl{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
.section-title{ font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:20px 0 8px; }
.toast{
  position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:#1c1c1e; color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{ opacity:1; }
.empty{ text-align:center; color:var(--muted); font-size:13px; padding:40px 10px; }
.pill-select{ display:flex; gap:8px; flex-wrap:wrap; }
.badge{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--border); color:var(--text); margin-right:4px; }
a.linklike{ color:var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="iconbtn" id="backBtn" style="display:none" onclick="TC.back()">‹</button>
    <h1 id="topTitle">Teacher Coach</h1>
  </div>
  <main id="view-root"></main>
  <nav id="tabbar">
    <button class="tab" data-tab="home" onclick="TC.goTab('home')"><span class="ti">🏠</span>今天</button>
    <button class="tab" data-tab="history" onclick="TC.goTab('history')"><span class="ti">🗂️</span>記錄</button>
    <button class="tab" data-tab="dashboard" onclick="TC.goTab('dashboard')"><span class="ti">📊</span>成長</button>
    <button class="tab" data-tab="settings" onclick="TC.goTab('settings')"><span class="ti">⚙️</span>設定</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 資料常數 ---------- */

  {id:'classroom', label:'班級經營', emoji:'🏫', theoryCat:'B', color:'var(--c-classroom)'},

  {id:'admin',     label:'行政',    emoji:'🏢', theoryCat:'D', color:'var(--c-admin)'},
  {id:'people',    label:'人事（成人關係）', emoji:'🤝', theoryCat:'E', color:'var(--c-people)'},
];
const QUICK_ENTRIES = [
  {emoji:'🧑‍🎓', label:'學生', cat:'student'},
  {emoji:'🏫', label:'班級', cat:'classroom'},
  {emoji:'📚', label:'教學', cat:'teaching'},

const LEVELS = [
  {id:1, label:'Level 1．個人行為', desc:'單一學生的個別行為表現。例：一位學生上課分心、忘記帶作業。'},
  {id:2, label:'Level 2．人際關係', desc:'學生與學生、或師生之間的互動與關係問題。例：同儕衝突、師生對立。'},

  {id:4, label:'Level 4．學校制度', desc:'跨班級、行政規定或學校制度層面的問題。例：跨班衝突、資源分配。'},
];
const RISK_ITEMS = [
  '有肢體傷害或人身安全疑慮',
  '疑似長期霸凌或欺凌模式',
  '學生出現自傷／自殺相關言語或行為',
  '疑似不當對待、虐待或性騷擾疑慮',
  '家長已正式投訴或提及法律行動',
  '依法規屬於強制通報事件（如校安或兒少保護通報）',
];
const PERIODS = ['早自習','上課中','下課','午休','放學後','其他'];
const EMOTIONS = [
  {id:'angry',emoji:'😡',label:'生氣'},
  {id:'anxious',emoji:'😰',label:'焦慮'},
  {id:'frustrated',emoji:'😔',label:'挫折'},
  {id:'afraid',emoji:'😨',label:'害怕'},
  {id:'powerless',emoji:'😤',label:'無力'},
  {id:'ok',emoji:'🙂',label:'還好／平靜'},
];
const AGENCY_OPTIONS = ['我的語氣','我的規則','我的反應','我的課程設計','我的溝通方式','我的紀錄','我的下一個行動'];
const RESILIENCE_SKILLS = ['班級經營能力','衝突處理能力','情緒調節能力','溝通表達能力','課程設計能力','觀察覺察能力','界線設定能力','復原力／韌性'];

const COACH_QUESTIONS = {
  student: ['雙方現在的情緒狀態如何？','衝突發生前的導火線是什麼？','這是第一次發生，還是重複出現的模式？','學生知道學校／班級對這類行為的處理方式嗎？'],
  classroom: ['你今天提醒了幾次？','每一次提醒的方式是否一樣？','學生知道不遵守規則的後果嗎？','你現在處理的是單一學生行為，還是班級規範尚未建立？'],
  teaching: ['這個狀況發生在教學的哪個環節？（講述／練習／討論／評量）','大約多少比例的學生出現這個狀況？','這是學生能力不足，還是任務設計不吻合需求？','你希望學生透過這個任務學到什麼？'],
  admin: ['這件事情牽涉哪些人的權責與立場？','有沒有明確的溝通期限或決策點？','如果站在對方的角度，他／她在意的是什麼？','這次溝通後，你希望達成什麼具體結果？'],
  people: ['對方的立場與你有什麼不同？','這是單一事件，還是長期累積的摩擦？','你需要設定什麼界線來保護自己？','你希望這段關係接下來往什麼方向發展？'],
};

const SOLUTION_TEMPLATES = {
  student:{
    now:'先確保安全，將雙方暫時分開、各自安頓情緒；不在其他學生面前當場評斷誰對誰錯。',
    tomorrow:'分別與雙方進行 5 分鐘個別談話，使用四個問句：發生什麼事？你感覺如何？你當時需要什麼？下一步可以怎麼做？必要時安排修復對話。',
    longTerm:'建立班級「衝突處理四步驟」：STOP → CALM → TALK → REPAIR，並在晨會安排演練與情境練習。',
  },

    now:'立即但平靜地提出一個具體、可執行的行為要求，避免情緒化指責。',
    tomorrow:'檢視目前班級常規是否清楚可見，必要時與全班重新討論並共訂規則與後果。',

  },
  teaching:{
    now:'先降低任務難度或調整分組，確保多數學生能重新進入學習。',
    tomorrow:'採用形成性評量快速了解學生落點（如一分鐘小測驗、舉手示意），依結果微調教學步調。',
    longTerm:'以 UDL／差異化教學重新設計單元，提供多元表徵與練習方式，並融入檢索練習鞏固學習。',

    tomorrow:'與相關同仁或主管簡短溝通，確認彼此對情況的理解一致，並列出可行方案。',
    longTerm:'透過分散式領導與利害關係人溝通機制，建立更清楚的分工與決策流程，減少未來類似摩擦。',
  },
  people:{
    now:'先釐清事實與自己的情緒，避免在情緒高漲時立即回應或做出承諾。',
    tomorrow:'安排一對一溝通，採用非暴力溝通（觀察－感受－需要－請求）表達立場，並預留傾聽對方觀點的空間。',
    longTerm:'透過困難對話技巧與心理安全感的建立，發展長期可信任的合作關係，並設定清楚的界線。',
  },
};

const THEORY_LIBRARY = [
  {cat:'A',name:'SEL 社會情緒學習',principle:'情緒覺察、人際技巧與負責任決策是可以被教導的能力。',app:'在衝突後帶學生辨識自己與對方的情緒，作為對話起點。'},
  {cat:'A',name:'修復式實踐 Restorative Practices',principle:'關注傷害如何被修復，而非誰該被處罰。',app:'讓涉事雙方在安全引導下說出影響，並共同決定修復方式。'},

  {cat:'A',name:'情緒教練 Emotion Coaching',principle:'先接住情緒，再處理行為與問題本身。',app:'先說「我看得出你很生氣」，再進入事情的討論。'},
  {cat:'A',name:'觀點取替 Perspective Taking',principle:'理解對方感受與立場能降低衝突升溫。',app:'請學生說出「如果你是對方，你會怎麼想？」。'},
  {cat:'A',name:'衝突解決 Conflict Resolution',principle:'衝突有固定可教的處理步驟與技巧。',app:'教學生用 STOP-CALM-TALK-REPAIR 四步驟處理糾紛。'},
  {cat:'A',name:'成長型思維 Growth Mindset',principle:'能力與關係可以透過努力與練習改變。',app:'告訴學生「這次沒處理好沒關係，我們可以練習下一次怎麼做」。'},
  {cat:'B',name:'Kounin 班級經營（Withitness）',principle:'老師對全班動態的掌握程度直接影響秩序。',app:'巡視時眼觀四方，在小問題擴大前用眼神或走近化解。'},
  {cat:'B',name:'正向行為支持 PBIS',principle:'教導並增強期待行為，勝過單純懲罰不當行為。',app:'明確教導、示範並獎勵你希望看到的課堂行為。'},
  {cat:'B',name:'回應式教室 Responsive Classroom',principle:'社會與學業學習同等重要，透過晨會與規則共創建立文化。',app:'用班級晨會共同討論並訂出「討論音量」等具體規範。'},
  {cat:'B',name:'行為改變技術 Behavior Modification',principle:'行為受其後果（增強／消弱）影響而改變。',app:'一致地增強遵守常規的行為，減少對輕微違規的過度關注。'},
  {cat:'B',name:'班級氣氛 Classroom Climate',principle:'安全、被尊重的氛圍是學習與行為的基礎。',app:'定期用簡短溫度計檢核班級的安全感與歸屬感。'},
  {cat:'B',name:'自我決定理論 Self-Determination Theory',principle:'自主、勝任、歸屬三種需求被滿足時，動機與行為更穩定。',app:'給學生有限但真實的選擇權，例如作業形式或座位安排。'},
  {cat:'C',name:'建構主義 Constructivism',principle:'學生透過連結既有經驗主動建構知識。',app:'先問學生已知的例子，再帶入新概念。'},
  {cat:'C',name:'合作學習 Cooperative Learning',principle:'結構化的小組互賴能提升學習與人際技巧。',app:'指派明確角色分工，讓每位成員都有不可取代的任務。'},
  {cat:'C',name:'通用學習設計 UDL',principle:'提供多元表徵、行動與參與方式，降低學習障礙。',app:'同一個概念同時提供圖像、文字與操作三種學習路徑。'},

  {cat:'C',name:'形成性評量 Formative Assessment',principle:'教學中持續蒐集證據以調整教學。',app:'用一分鐘小測驗或舉手示意快速掌握學生理解狀況。'},
  {cat:'C',name:'檢索練習 Retrieval Practice',principle:'主動回想比重複閱讀更能鞏固記憶。',app:'課堂結束前花 3 分鐘讓學生默寫今天學到的重點。'},

async function callAI(systemPrompt, userPrompt){
  const ai = DB.settings.ai;
  const provider = ai.provider;
  if(!provider) throw new Error('尚未設定 AI 提供者');
  const key = (ai.keys[provider]||'').trim();
  if(!key) throw new Error('尚未輸入 API Key');
  const model = ai.models[provider] || AI_PROVIDERS[provider].defaultModel;

  if(provider==='openai'){
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({ model, messages:[{role:'system',content:systemPrompt},{role:'user',content:userPrompt}], max_tokens:700, temperature:0.7 }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error((data.error&&data.error.message) || ('OpenAI 呼叫失敗（'+res.status+'）'));
    return (data.choices[0].message.content||'').trim();
  }
  if(provider==='gemini'){
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ systemInstruction:{parts:[{text:systemPrompt}]}, contents:[{role:'user', parts:[{text:userPrompt}]}] }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error((data.error&&data.error.message) || ('Gemini 呼叫失敗（'+res.status+'）'));
    return (data.candidates[0].content.parts.map(p=>p.text).join('')).trim();
  }
  if(provider==='claude'){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({ model, max_tokens:800, system:systemPrompt, messages:[{role:'user',content:userPrompt}] }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error((data.error&&data.error.message) || ('Claude 呼叫失敗（'+res.status+'）'));
    return data.content.map(c=>c.text||'').join('').trim();
  }
  throw new Error('不支援的提供者');
}

function parseSolutionAI(text){
  const grab = (label, stopPattern) => {
    const re = stopPattern
      ? new RegExp(label+'\\s*[:：]\\s*([\\s\\S]*?)(?='+stopPattern+')', 'i')
      : new RegExp(label+'\\s*[:：]\\s*([\\s\\S]*)$', 'i');
    const m = text.match(re);
    return m ? m[1].trim() : '';
  };
  const now = grab('NOW', 'TOMORROW\\s*[:：]|LONGTERM\\s*[:：]');
  const tomorrow = grab('TOMORROW', 'LONGTERM\\s*[:：]');
  const longTerm = grab('LONGTERM', '');
  if(!now && !tomorrow && !longTerm) return null;
  return {now, tomorrow, longTerm};
}

function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ const d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }
function catInfo(id){ return CATEGORIES.find(c=>c.id===id); }
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return (dt.getMonth()+1)+'/'+dt.getDate();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- Mental score 計算 ---------- */
function subScores(ev){
  const m = ev.mental||{};
  const selfAwareness = (m.emotion!=null) ? 100 : 0;
  const regulation = (m.emotion==null) ? 0 : (m.emotionScore<=80 ? 100 : (m.pauseConfirmed?70:30));
  const flexibility = (m.fact&&m.interpretation) ? 100 : ((m.fact||m.interpretation)?50:0);
  const resilience = (m.resilienceNote&&m.resilienceNote.trim()) ? 100 : 0;
  const agency = (m.agency&&m.agency.length) ? 100 : 0;
  return {selfAwareness, regulation, flexibility, resilience, agency};
}
function compositeScore(ev){
  if(ev.isHighRisk) return null;
  const s = subScores(ev);
  return Math.round((s.selfAwareness+s.regulation+s.flexibility+s.resilience+s.agency)/5);
}
function todayMentalScore(){
  const todays = DB.events.filter(e=>e.date===todayStr() && !e.isHighRisk);
  if(!todays.length) return 80;
  const scores = todays.map(compositeScore).filter(s=>s!=null);
  if(!scores.length) return 80;
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}

/* ---------- Render：主入口 ---------- */
function render(){
  document.getElementById('backBtn').style.display = (TC.flow||TC.detailId) ? '' : 'none';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', !TC.flow && !TC.detailId && b.dataset.tab===TC.tab));
  document.getElementById('tabbar').style.display = (TC.flow) ? 'none' : 'flex';

  const root = document.getElementById('view-root');
  const title = document.getElementById('topTitle');

  if(TC.flow){ title.textContent = flowTitle(TC.flow); root.innerHTML = renderFlow(TC.flow); return; }
  if(TC.detailId){ title.textContent = '事件詳情'; root.innerHTML = renderDetail(TC.detailId); return; }

  title.textContent = {home:'Teacher Coach', history:'事件記錄', dashboard:'教師成長', settings:'設定'}[TC.tab];
  if(TC.tab==='home') root.innerHTML = renderHome();
  else if(TC.tab==='history') root.innerHTML = renderHistory();
  else if(TC.tab==='dashboard') root.innerHTML = renderDashboard();
  else root.innerHTML = renderSettings();
}

function flowTitle(f){
  if(f.branch==='risk' && f.step>=99) return '風險評估';
  return ['描述事件','問題診斷','風險檢核','教練提問','行動方案','心理素質','反思與實驗'][f.step] || '新增事件';
}

/* ---------- History ---------- */
function renderHistory(){
  if(!DB.events.length) return `<div class="empty">還沒有任何記錄。<br>從「今天」開始新增第一個事件吧。</div>`;
  const groups = {};
  DB.events.slice().sort((a,b)=>b.date.localeCompare(a.date) || (b.savedAt||'').localeCompare(a.savedAt||'')).forEach(ev=>{
    (groups[ev.date] = groups[ev.date]||[]).push(ev);
  });
  let html='';
  Object.keys(groups).sort().reverse().forEach(date=>{
    html += `<div class="date-sep">${date}</div>`;
    html += groups[date].map(eventRow).join('');
  });
  return html;
}

/* ---------- Flow renderer ---------- */
function renderFlow(f){
  if(f.branch==='risk' && f.step>=99) return renderRiskEnd(f);
  const steps = ['input','diagnosis','risk','coach','solution','mental','reflect'];
  const dots = steps.map((s,i)=>`<span class="${i===f.step?'on':''}"></span>`).join('');
  const body = [renderStepInput, renderStepDiagnosis, renderStepRisk, renderStepCoach, renderStepSolution, renderStepMental, renderStepReflect][f.step](f.draft);
  return `<div class="progress-dots">${dots}</div>${body}`;
}

/* ---------- Dashboard ---------- */
function radarSVG(labels, values, size){
  size = size||220;
  const cx=size/2, cy=size/2, R=size/2-30, n=labels.length;
  const pt = (i,r)=>{ const a = -Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let grid='';
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts = labels.map((_,i)=>pt(i,R*f).join(',')).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  });
  labels.forEach((_,i)=>{ const [x,y]=pt(i,R); grid += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`; });
  const dataPts = values.map((v,i)=>pt(i, R*Math.max(0,Math.min(100,v))/100).join(',')).join(' ');
  const labelEls = labels.map((l,i)=>{ const [x,y]=pt(i,R+18); return `<text x="${x}" y="${y}" font-size="10.5" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${l}</text>`; }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%; max-width:280px; display:block; margin:0 auto;">
    ${grid}
    <polygon points="${dataPts}" fill="rgba(79,124,255,0.35)" stroke="var(--accent)" stroke-width="2"/>
    ${labelEls}
  </svg>`;
}

function renderDashboard(){
  const events = DB.events;
  if(!events.length) return `<div class="empty">還沒有資料可以分析。<br>先記錄幾個事件吧。</div>`;

  const counts = {}; CATEGORIES.forEach(c=>counts[c.id]=0);
  events.forEach(e=>{ if(counts[e.category.primary]!=null) counts[e.category.primary]++; });
  const maxCount = Math.max(1,...Object.values(counts));

  const normalEvents = events.filter(e=>!e.isHighRisk && e.mental);
  const skillLabels = ['自我覺察','情緒調節','認知彈性','復原力','主動性'];
  let avg = {selfAwareness:0,regulation:0,flexibility:0,resilience:0,agency:0};
  if(normalEvents.length){
    normalEvents.forEach(e=>{ const s=subScores(e); Object.keys(avg).forEach(k=>avg[k]+=s[k]); });
    Object.keys(avg).forEach(k=>avg[k]=Math.round(avg[k]/normalEvents.length));
  }

  const byWeek = {};
  events.forEach(e=>{
    const dt = new Date(e.date+'T00:00:00');
    const jan1 = new Date(dt.getFullYear(),0,1);
    const week = Math.ceil((((dt-jan1)/86400000)+jan1.getDay()+1)/7);
    const key = dt.getFullYear()+'-W'+week;
    (byWeek[key]=byWeek[key]||[]).push(e);
  });
  const weekKeys = Object.keys(byWeek).sort();

  let html = `<div class="card">
    <h2>問題類型分佈</h2>
    <div class="bars">
    ${CATEGORIES.map(c=>`<div class="bar-item"><div class="lbl"><span>${c.emoji} ${c.label}</span><span>${counts[c.id]}</span></div>
      <div class="bar-outer"><div class="bar-inner" style="width:${counts[c.id]/maxCount*100}%; background:${c.color}"></div></div></div>`).join('')}
    </div>
  </div>`;

  html += `<div class="card">
    <h2>Mental Strength 五角圖</h2>
    ${normalEvents.length ? radarSVG(skillLabels,[avg.selfAwareness,avg.regulation,avg.flexibility,avg.resilience,avg.agency]) : '<p class="muted">尚無足夠資料</p>'}
  </div>`;

  html += `<div class="card">
    <h2>成長曲線（依週）</h2>
    ${weekKeys.map(k=>{
      const evs = byWeek[k];
      const scored = evs.map(compositeScore).filter(s=>s!=null);
      const avgS = scored.length ? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length) : null;
      return `<div class="bar-item"><div class="lbl"><span>${k}．${evs.length} 個事件</span><span>${avgS!=null?avgS+'/100':'—'}</span></div>
        <div class="bar-outer"><div class="bar-inner" style="width:${avgS||0}%"></div></div></div>`;
    }).join('') || '<p class="muted">尚無資料</p>'}
  </div>`;

  return html;
}

  </div>
  <div class="card">

  </div>
  <div class="card">
    <h2>關於</h2>
    <p class="muted">Teacher Coach v1.0（單機版）<br>不只是解決問題，而是訓練自己成為更好的老師。<br><br>本 App 為教師自我反思與成長紀錄工具，遇到安全疑慮或高風險事件時，請務必依學校正式程序處理，不能取代專業協助。</p>
  </div>`;
}

render();

  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
